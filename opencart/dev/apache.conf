ServerName localhost
<Directory /var/www/html>
    AllowOverride All
    Options -Indexes -MultiViews
    Require all granted
</Directory>

# Use the URL path without its query string. Admin tokens are in the query.
LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" cmteh
<VirtualHost *:80>
    DocumentRoot /var/www/html
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 cmteh
</VirtualHost>
